name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here — see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the form with #project:reason
        2. Fill in ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: php
    attributes:
      label: PHP version
      placeholder: "8.3.6"
    validations:
      required: true
  - type: dropdown
    id: mail
    attributes:
      label: mail.client
      options: [smtp, brevo]
    validations:
      required: true
  - type: dropdown
    id: server
    attributes:
      label: Web server and layout
      options:
        - "Apache, document root on public/"
        - "Apache, fixed web root (root .htaccess)"
        - "nginx"
        - "Other"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: PHP error log or browser console. Redact addresses, keys and hostnames.
      render: text
